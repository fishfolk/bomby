[package]
name = "bomby"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_ecs_ldtk = "0.16"
bevy-inspector-egui = "0.38"
bevy_kira_audio = { version = "0.27", features = ["wav"] }
leafwing-input-manager = "0.22"

directories = "4.0"
itertools = "0.10"
noise = { git = "https://github.com/bsurmanski/noise-rs", rev = "5abdde1b819eccc47e74969c15e1b56ae5a055d6" }
rand = { version = "0.8", default-features = false, features = ["std", "small_rng"] }
serde = "1.0"
serde_derive = "1.0"
serde_ignored = "0.1.6"
toml = "0.5"

[dependencies.bevy]
version = "0.20"
default-features = false
features = ["2d", "audio", "ui"]

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev.package."*"]
opt-level = 2
